<a class="salto" href="#contenido">Saltar al contenido</a>

<header class="encabezado">
  <div class="contenedor encabezado__fila">
    <a class="marca" href="{{ '/' | relative_url }}">
      <img class="marca__logo" src="{{ site.data.sitio.logo_utp | relative_url }}" alt="{{ site.data.sitio.institucion }}">
      <img class="marca__logo marca__logo--sala" src="{{ site.data.sitio.logo_sala | relative_url }}" alt="Logo de la {{ site.data.sitio.nombre }}">
      <span class="marca__texto">
        <span class="marca__nombre">{{ site.data.sitio.nombre }}</span>
        <span class="marca__sub">UTP · {{ site.data.sitio.dependencia }}</span>
      </span>
    </a>
    <form class="buscador" role="search" action="{{ '/buscar/' | relative_url }}" method="get">
      <label class="sr" for="q-encabezado">Buscar en el portal</label>
      <input id="q-encabezado" name="q" type="search" placeholder="Buscar clases, señas, recursos…">
      <button type="submit" class="boton-icono" aria-label="Buscar">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
    </form>
    <button class="boton-menu" type="button" aria-expanded="false" aria-controls="menu-principal">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>
      <span class="boton-menu__texto">Menú</span>
    </button>
  </div>

  <nav class="nav" aria-label="Principal">
    <ul id="menu-principal" class="nav__lista contenedor">
      {%- for item in site.data.menu.items %}
      <li class="nav__item" data-clip="{% if item.clip and item.clip != '' %}{{ item.clip | relative_url }}{% endif %}" data-titulo="{{ item.titulo | escape }}">
        <a class="nav__enlace" href="{{ item.url | relative_url }}"{% if item.id == page.seccion %} aria-current="page"{% endif %}>{{ item.titulo }}</a>
        <button class="nav__mano" type="button" aria-expanded="false" aria-label="Ver seña en LSC de {{ item.titulo | escape }}">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
        </button>
        <div class="nav__sena" hidden></div>
      </li>
      {%- endfor %}
    </ul>

    <section class="sena-panel" aria-label="Seña en LSC de la opción del menú" hidden>
      <div class="sena-panel__cabecera">
        <div>
          <span class="etiqueta">Seña en LSC</span>
          <span class="sena-panel__titulo"></span>
        </div>
        <div class="sena-panel__acciones">
          <button type="button" class="boton-chico sena-panel__fijar" aria-pressed="false">Fijar</button>
          <button type="button" class="boton-icono boton-icono--claro sena-panel__cerrar" aria-label="Cerrar seña">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
      <div class="sena-panel__video"></div>
    </section>
  </nav>
</header>
