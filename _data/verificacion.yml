# Verificación del servicio de interpretación.
# El código QR se genera solo a partir del enlace de cada formulario,
# así el botón y el QR siempre llevan al mismo destino.
video: ""
texto: "En la Sala Conectando Sentidos queremos que la interpretación LSC – español responda a lo que cada clase necesita. Por eso te invitamos a contarnos cómo fue el servicio que recibiste: si entendiste la clase, si pudiste ver bien al intérprete y si tu voz se escuchó cuando participaste. Tus respuestas nos ayudan a reconocer lo que funciona y a mejorar lo que hace falta. No evaluamos tu aprendizaje ni el trabajo del docente: valoramos el servicio. Responder toma pocos minutos y es voluntario."

