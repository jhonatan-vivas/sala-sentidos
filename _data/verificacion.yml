privacidad: "Tu participación es voluntaria y tus respuestas son confidenciales. No afectan tu relación con el intérprete, con el docente ni con la asignatura, y solo se usan para mejorar el servicio. Los datos se tratan según la Ley 1581 de 2012 de protección de datos personales y la política de tratamiento de datos de la UTP."
