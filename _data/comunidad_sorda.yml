bienvenida_texto: "La comunidad sorda está conformada por personas que comparten
  experiencias, una identidad cultural y, en muchos casos, una lengua propia: la
  Lengua de Señas Colombiana (LSC). Reconocer su diversidad implica comprender
  sus formas de comunicación, sus expresiones culturales y sus derechos, así
  como identificar las barreras que pueden enfrentar en diferentes entornos. En
  esta sección encontrarás información que permite acercarte a la comunidad
  sorda, reconocer su riqueza lingüística y cultural y promover espacios más
  accesibles, inclusivos y respetuosos de la diversidad."
