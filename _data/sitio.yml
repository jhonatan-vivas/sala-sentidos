texto_que_es: La Sala Conectando Sentidos de la Universidad Tecnológica de
  Pereira fue creada en 2017 para responder a necesidades de inclusión y
  bienestar integral de la comunidad universitaria. Es un espacio accesible y
  respetuoso de la diversidad, dedicado a la estimulación sensorial, el
  acompañamiento psicosocial y el desarrollo de habilidades que favorecen el
  aprendizaje y la calidad de vida.
