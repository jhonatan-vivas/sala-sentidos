# ─────────────────────────────────────────────────────────────
#  Portal Sala Conectando Sentidos · UTP
#  Configuración general de Jekyll (GitHub Pages lo compila solo).
# ─────────────────────────────────────────────────────────────

title: Sala Conectando Sentidos
description: >-
  Información, recursos y servicios para la Comunidad Sorda, la comunidad ciega
  y quienes aprenden Lengua de Señas Colombiana (LSC) en la UTP.
lang: es

# Para un dominio propio o un repositorio USUARIO.github.io  →  baseurl: ""
baseurl: "/sala-sentidos"
url: "https://jhonatan-vivas.github.io"

# Colecciones: una clase o una seña = un archivo (fácil de agregar y quitar)
collections:
  clases:
    output: true
    permalink: /curso/:name/
  senas:
    output: false

defaults:
  - scope:
      path: ""
      type: clases
    values:
      layout: redirige
      seccion: curso

markdown: kramdown
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .herramientas
